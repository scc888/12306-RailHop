services:
  railhop:
    build:
      context: .
      dockerfile: Dockerfile
    image: 12306-railhop:latest
    container_name: 12306-railhop
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - QUERY_CACHE_DATABASE_URL=${QUERY_CACHE_DATABASE_URL:-}
      - TICKET_CACHE_SECONDS=${TICKET_CACHE_SECONDS:-15}
    extra_hosts:
      - "host.docker.internal:host-gateway"
