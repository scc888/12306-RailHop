name: Deploy to Server via Docker

on:
  push:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and Test Frontend
        working-directory: frontend
        run: |
          npm install
          npm test
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test Backend
        run: |
          pip install -r backend/requirements.txt httpx
          python -m unittest discover -s backend -p "test_*.py"

      - name: Package Release
        run: |
          RELEASE_TAG=$(date +%Y%m%d%H%M%S)
          python backend/scripts/build_release.py "$RELEASE_TAG"
          ls -lh dist/

      - name: Deploy to Server via Docker
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
        run: |
          python deploy/write_deploy_key.py

          TARBALL=$(ls dist/12306-railhop-*.tar.gz | head -n1)
          TARNAME=$(basename "$TARBALL")
          echo "Uploading $TARNAME to server..."
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$TARBALL" "${USER}@${HOST}:/root/${TARNAME}"

          echo "Running remote Docker deployment on server..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "${USER}@${HOST}" "bash -s" << EOF
            set -e
            PKG_DIR="/root/${TARNAME%.tar.gz}"
            mkdir -p "\$PKG_DIR"
            tar -xzf "/root/$TARNAME" -C "\$PKG_DIR" --strip-components=1
            cd "\$PKG_DIR"
            bash deploy-docker.sh
            rm -f "/root/$TARNAME"
          EOF

      - name: Verify Public Accessibility
        env:
          HOST: ${{ secrets.SERVER_HOST }}
        run: |
          echo "Verifying public server health..."
          for i in {1..15}; do
            if curl -fsS "http://${HOST}:8080/health" > /dev/null 2>&1; then
              echo "Public health check passed!"
              curl -fsS "http://${HOST}:8080/health"
              echo ""
              curl -fsS "http://${HOST}:8080/api/stations/search?keyword=shanghai&limit=3"
              echo ""
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: Public health check failed after timeout"
          exit 1
