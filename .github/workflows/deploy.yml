name: Deploy to Server

on:
  push:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies & Build
        working-directory: frontend
        run: |
          npm install
          npm test
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Backend Tests
        run: |
          pip install -r backend/requirements.txt
          python -m unittest discover -s backend -p "test_*.py"

      - name: Build Deployment Package
        run: |
          TAG=$(date +'%Y%m%d%H%M%S')
          python backend/scripts/build_release.py "$TAG"
          echo "PKG_TAG=$TAG" >> $GITHUB_ENV

      - name: Upload Package to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "dist/12306-railhop-${{ env.PKG_TAG }}.tar.gz"
          target: "/root"
          strip_components: 1

      - name: Execute Deploy Script on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd /root
            PKG="12306-railhop-${{ env.PKG_TAG }}.tar.gz"
            DIR="12306-railhop-${{ env.PKG_TAG }}"
            echo "Extracting $PKG..."
            tar -xzf "$PKG"
            cd "$DIR"
            bash deploy.sh
