name: Deploy to Server

on:
  push:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies & Build
        working-directory: frontend
        run: |
          npm install
          npm test
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Backend Tests
        run: |
          pip install -r backend/requirements.txt httpx
          python -m unittest discover -s backend -p "test_*.py"

      - name: Build Deployment Package
        run: |
          TAG=$(date +'%Y%m%d%H%M%S')
          python backend/scripts/build_release.py "$TAG"
          echo "PKG_TAG=$TAG" >> $GITHUB_ENV

      - name: Deploy to Server via SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          PKG="12306-railhop-${PKG_TAG}.tar.gz"
          DIR="12306-railhop-${PKG_TAG}"

          echo "Uploading $PKG to server..."
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "dist/$PKG" "${USER}@${HOST}:/root/$PKG"

          echo "Executing deployment on server..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "${USER}@${HOST}" "bash -s" << EOF
            set -e
            cd /root
            echo "Extracting $PKG..."
            tar -xzf "$PKG"
            cd "$DIR"
            bash deploy.sh
          EOF
